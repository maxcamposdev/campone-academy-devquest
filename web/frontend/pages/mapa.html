<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa da CampOne Academy</title>
    <link rel="stylesheet" href="../styles/mapa.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">CampOne Academy DevQuest</div>
            <div class="status" id="playerStatus">Carregando jogador...</div>
        </header>

        <section class="hero">
            <h1>Mapa da CampOne Academy</h1>
            <p>
                Bem-vindo ao mapa da sua jornada. Aqui você acompanha sua evolução,
                revisa a Academy e acessa as próximas fases desbloqueadas.
            </p>
        </section>

        <section class="grid" id="academyGrid">
            <article class="card">
                <h2>Carregando Academy...</h2>
                <p>Preparando mapa das etapas.</p>
            </article>
        </section>
        <a class="botao-voltar-padrao" href="../index.html">Voltar</a>
    </main>
    <script src="../js/mapa.js"></script>
</body>
</html>
